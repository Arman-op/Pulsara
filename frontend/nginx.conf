# Static hosting for the built client.
#
# Two things matter here and nothing else does: a single-page app needs every
# unknown path to return index.html so the router can handle it, and the
# fingerprinted assets need a cache policy that index.html must not share.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so these are safe to cache
    # indefinitely: a new build produces new names rather than new contents at
    # the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one file whose name never changes, so caching it is how
    # a returning user gets yesterday's asset references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /alerts is a route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is served from its own origin, so this document needs no
    # inline script and no framing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
