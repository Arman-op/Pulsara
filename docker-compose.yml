# Local development infrastructure.
#
# This file provides the backing services the application needs on a developer
# machine. The application containers themselves are not defined here yet:
# the previous version declared `frontend` and `backend` services that built
# from `./frontend/Dockerfile` and `./backend/Dockerfile`, neither of which
# existed, so `docker compose up` failed on a clean checkout. They return with
# the real container images.
#
# It also hard-coded `JWT_SECRET=production_secret_change_me` in a committed
# file. Nothing in this file is a credential for anything but a throwaway local
# database, and the API refuses to start with a placeholder signing key.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsara-postgres-dev
    environment:
      POSTGRES_USER: pulsara
      POSTGRES_PASSWORD: pulsara_local_dev
      POSTGRES_DB: pulsara
    ports:
      # Deliberately not 5432: developers commonly have a native PostgreSQL
      # already bound there, and a silent port clash is a confusing failure.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsara -d pulsara']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - pulsara

networks:
  pulsara:
    driver: bridge

volumes:
  postgres-data:
